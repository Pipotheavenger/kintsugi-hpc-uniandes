---
experiment_name: "dam1_bridge_v6_whisper_small_en"
description: "DAM 1 on BRIDGE-MH baseline, questionnaire version 6 only (1,821 people / 3,645 recordings). Same split as dam1_bridge.yaml restricted to v6 (hpc/bridge_subset.py). whisper-small.en. Based on research/stable/ordinal_regression_mtl_mar_2024/config.yaml"

model_params:
  model_path: "model.DepAnxClassifier"
  ckpt_path: ""
  restore_training_state: false
  config:
    whisper_config:
      model: "openai/whisper-small.en"
      hf_config:
        encoder_layerdrop: 0.0
        dropout: 0.0
        activation_dropout: 0.0
      lora_params:
        r: 32
        lora_alpha: 64.0
        target_modules: "all-linear"
        lora_dropout: 0.4
        modules_to_save:
          - conv1
          - conv2
        bias: "all"
    classifier_config:
      shared_projection_dim:
        - 256
        - 64
      tasks:
        depression:
          proj_dim: 128
          dropout: 0.4
        anxiety:
          proj_dim: 128
          dropout: 0.4

training_params:
  seed: 44
  batch_size: 2
  effective_batch_size: 32      # upstream 128; v6 train has 1,275 people -> ~40 optimizer steps per epoch
  max_epochs: 32                # upstream
  early_stopping_patience: 10   # upstream (counted in validations)
  training_examples_per_eval: 1275   # one validation per epoch (v6 train: 1,275 people; upstream 16000)
  cpus_per_worker: 4            # sbatch asks for 8 CPUs
  monitor_loss: "max:metrics/val/sn_eq_sp@0%i"
  scheduler:
    gamma: 0.5
    milestones:
      - 20
      - 26
  optimizer:
    backbone:
      lr: 1.6e-04
      weight_decay: 0.001
    classifier:
      lr: 8.0e-04
      weight_decay: 0.001
  tasks:
    depression:
      ordinal_loss_target_type: "exact28"
      num_classes: 28
      score_variance_loss_weight: 40.0
    anxiety:
      ordinal_loss_target_type: "exact22"
      num_classes: 22
      score_variance_loss_weight: 40.0

data_params:
  metadata=kirad.datasets_and_dataloaders.KintsugiMetadata:
    train:
      df_or_dataset_version: "/hpcfs/home/ing_quimica/sf.valencia/Kintusgi/Data/bridge_baseline/dam1_v6/train.csv"
      duration_column: "prompt_vad_trimmed_duration"
      merge_rows_by_subject: "many_to_one"   # upstream: both recordings of a person become one sample (column `user`)
      audio_root: "/hpcfs/home/ing_quimica/sf.valencia/Kintusgi/Data/bridge_baseline/dam1/audio"
    val:
      df_or_dataset_version: "/hpcfs/home/ing_quimica/sf.valencia/Kintusgi/Data/bridge_baseline/dam1_v6/val.csv"
    test:
      df_or_dataset_version: "/hpcfs/home/ing_quimica/sf.valencia/Kintusgi/Data/bridge_baseline/dam1_v6/test.csv"
    val_test:
      duration_column: "prompt_vad_cut_duration"
      audio_root: "/hpcfs/home/ing_quimica/sf.valencia/Kintusgi/Data/bridge_baseline/dam1/audio"
    default:
      label_column:
        depression: "phq"
        anxiety: "gad"
      fraction: 1.0
  audio=kirad.datasets_and_dataloaders.KintsugiAudioDataset:
    train:
      window_method: "random_adjacent_pair"
    val_test:
      window_method: "all"
    default:
      preprocessor: false
      normalize_audio: true
