# DAM 3 chain, step B1: train DAM 2. Based on research/stable/ordinal_regression_mtl_jun_2024/config.yaml.
# Run from ~/Kintusgi/kintsugi-hpc-uniandes:
#   sbatch hpc/run_job.sbatch scripts/launcher.py train hpc/configs/dam2.yaml --experiment-dir research/stable/ordinal_regression_mtl_jun_2024
# Changes vs. original (hpc/BITACORA.md, step 10): CSV/audio_root/text_root per split (synthetic data),
# no private dataset version / data_sources / dataset_fold; text_dir removed (not a valid field, text_root
# lives in the metadata); ideal_logmel_energies absolute path; effective_batch_size 2, max_epochs 3,
# training_examples_per_eval 4, cpus_per_worker 4.
---
experiment_name: dam3_stage1_B1_dam2
description: 'DAM 3 chain, step B1: DAM 2 (Whisper + BERT, LoRA) on synthetic random data with text, 8/4/4'
model_params:
  model_path: model.DepAnxClassifierWhisperBERT
  ckpt_path: ''
  restore_training_state: false
  config:
    whisper_config:
      model: openai/whisper-small.en
      hf_config:
        encoder_layerdrop: 0.0
        dropout: 0.0
        activation_dropout: 0.0
      lora_params:
        r: 32
        lora_alpha: 64.0
        target_modules: all-linear
        lora_dropout: 0.4
        modules_to_save:
        - conv1
        - conv2
        bias: all
    bert_config:
      model: google-bert/bert-base-uncased
      hf_config:
        attention_probs_dropout_prob: 0.0
        classifier_dropout: 0.0
        hidden_dropout_prob: 0.0
      lora_params:
        r: 32
        lora_alpha: 64.0
        target_modules: all-linear
        lora_dropout: 0.4
        bias: all
    classifier_config:
      shared_projection_dim:
      - 256
      - 64
      tasks:
        depression:
          proj_dim: 128
          dropout: 0.4
        anxiety:
          proj_dim: 128
          dropout: 0.4
training_params:
  seed: 44
  batch_size: 2
  effective_batch_size: 2
  max_epochs: 3
  early_stopping_patience: 10
  monitor_loss: max:metrics/val/sn_eq_sp@0%i
  scheduler:
    gamma: 0.5
    milestones:
    - 20
    - 26
  optimizer:
    backbone:
      lr: 0.00016
      weight_decay: 0.001
    classifier:
      lr: 0.0008
      weight_decay: 0.001
  tasks:
    depression:
      ordinal_loss_target_type: exact28
      num_classes: 28
    anxiety:
      ordinal_loss_target_type: exact22
      num_classes: 22
  training_examples_per_eval: 4
  cpus_per_worker: 4
data_params:
  metadata=kirad.datasets_and_dataloaders.KintsugiMetadata:
    train:
      df_or_dataset_version: /hpcfs/home/ing_quimica/sf.valencia/Kintusgi/Data/kintsugi_synth/dam3_stage1/random/train.csv
      duration_column: prompt_vad_trimmed_duration
      audio_root: /hpcfs/home/ing_quimica/sf.valencia/Kintusgi/Data/kintsugi_synth/dam3_stage1/random/audio
      text_root: /hpcfs/home/ing_quimica/sf.valencia/Kintusgi/Data/kintsugi_synth/dam3_stage1/random/text
    val:
      df_or_dataset_version: /hpcfs/home/ing_quimica/sf.valencia/Kintusgi/Data/kintsugi_synth/dam3_stage1/random/val.csv
    test:
      df_or_dataset_version: /hpcfs/home/ing_quimica/sf.valencia/Kintusgi/Data/kintsugi_synth/dam3_stage1/random/test.csv
    val_test:
      duration_column: prompt_vad_cut_duration
      audio_root: /hpcfs/home/ing_quimica/sf.valencia/Kintusgi/Data/kintsugi_synth/dam3_stage1/random/audio
      text_root: /hpcfs/home/ing_quimica/sf.valencia/Kintusgi/Data/kintsugi_synth/dam3_stage1/random/text
    default:
      label_column:
        depression: phq
        anxiety: gad
      fraction: 1.0
  audio=kirad.datasets_and_dataloaders.KintsugiAudioDataset:
    train:
      window_method: single_random
    val_test:
      window_method: all
    default:
      preprocessor: openai/whisper-small.en
      normalize_audio: true
      normalize_features: true
      ideal_logmel_energies: /hpcfs/home/ing_quimica/sf.valencia/Kintusgi/kintsugi-hpc-uniandes/hpc/configs/logmel_energies.npy
  text=kirad.datasets_and_dataloaders.KintsugiTextDataset:
    default:
      preprocessor: google-bert/bert-base-uncased
